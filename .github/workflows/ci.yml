name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node build.js

      - name: Ensure dist is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "❌ dist/ 与源码不同步，请本地运行 npm run build 并提交"
            git diff --stat -- dist/
            exit 1
          fi
          echo "✅ dist 与源码一致"

      - name: Unit tests
        run: |
          node test/run.js
          node test/holdout.js

      - name: Smoke test
        run: node test/harness.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci || npm install

      - run: npx playwright install --with-deps chromium

      - name: Build
        run: node build.js

      - name: E2E（主流程）
        run: node test/e2e/accept.mjs

      - name: E2E（并发实现）
        run: node test/e2e/concurrency.mjs

      - name: E2E（悬浮球）
        run: node test/e2e/orb.mjs
